name: Schedule LinkedIn Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # Auto-generated 1
    - cron: "0 12 * * *" # Auto-generated 2

jobs:
  update-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Generate Random Cron Times
        run: |
          hour1=$((4 + RANDOM % 13))
          hour2=$((4 + RANDOM % 13))
          while [ "$hour1" -eq "$hour2" ]; do
            hour2=$((4 + RANDOM % 13))
          done
          minute1=$((15 * (RANDOM % 4)))
          minute2=$((15 * (RANDOM % 4)))
          echo "Generated Times: $hour1:$minute1 and $hour2:$minute2 UTC"
          sed -i "s|cron: .* # Auto-generated 1|cron: \"$minute1 $hour1 * * *\" # Auto-generated 1|" .github/workflows/main.yml
          sed -i "s|cron: .* # Auto-generated 2|cron: \"$minute2 $hour2 * * *\" # Auto-generated 2|" .github/workflows/main.yml

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/main.yml
          git commit -m "Update cron with random times"
          git push

  post-to-linkedin:
    needs: update-cron
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          PROMPT: ${{ secrets.PROMPT }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
